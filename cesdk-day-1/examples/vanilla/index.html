<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cesdk-day-1 vanilla</title>
    <style>
      html,
      body,
      #cesdk_container {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="cesdk_container"></div>
    <script type="module">
      // Plain JS entry proving multi-framework support beyond React (checklist 58).
      import CreativeEditorSDK from 'https://cdn.img.ly/packages/imgly/cesdk-js/1.83.0/cesdk-js.mjs';

      const params = new URLSearchParams(location.search);
      const license =
        params.get('license') ||
        localStorage.getItem('VITE_CESDK_LICENSE') ||
        '';

      const cesdk = await CreativeEditorSDK.create('#cesdk_container', {
        license: license || undefined,
        baseURL: 'https://cdn.img.ly/packages/imgly/cesdk-js/1.83.0/assets',
        userId: 'cesdk-day-1-vanilla',
      });
      await cesdk.createDesignScene();
      document.title = 'cesdk-day-1 vanilla — ready';
    </script>
  </body>
</html>
